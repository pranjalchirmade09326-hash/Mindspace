services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  # Not exposed outside — only reachable within mindspace-net
  postgres:
    image: postgres:16-alpine
    container_name: mindspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindspace
      POSTGRES_PASSWORD: mindspace
      POSTGRES_DB: mindspace_main
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mindspace-net
    configs:
      - source: init_db
        target: /docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mindspace} -d mindspace_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── App ─────────────────────────────────────────────────────────────────────
  app:
    image: ghcr.io/naveenraj-g/mindspace-frontend:latest
    container_name: mindspace-frontend
    restart: unless-stopped
    env_file:
      - .env.vps
    volumes:
      - /root/mindspace/logs:/app/logs
      - /root/mindspace/uploads:/app/uploads
    ports:
      - "3003:3000"
    networks:
      - mindspace-net
      - fhir-server_fhir-net
      - iam-app_bezs-net
      - a2ui-agent_default
      - mindspace-agents_default
    depends_on:
      postgres:
        condition: service_healthy

# ─── Creates mindspace_telemedicine on first postgres start ─────────────────────
configs:
  init_db:
    content: |
      CREATE DATABASE mindspace_telemedicine;

volumes:
  postgres_data:

networks:
  mindspace-net:
    external: true
  # FHIR REST + GQL services
  fhir-server_fhir-net:
    external: true
  # IAM / BetterAuth
  iam-app_bezs-net:
    external: true
  # A2UI agents (intake, consultation)
  a2ui-agent_default:
    external: true
  # MindSpace agents (assessment, doctor report, etc.)
  mindspace-agents_default:
    external: true
