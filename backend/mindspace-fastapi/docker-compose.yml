services:
  mindspace-postgres:
    image: postgres:16
    container_name: mindspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindspace}
      POSTGRES_USER: ${POSTGRES_USER:-mindspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - "5433:5432"
    volumes:
      - mindspace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - mindspace-api_default

  mindspace-fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindspace-fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mindspace}:${POSTGRES_PASSWORD:-dev-only-change-me}@mindspace-postgres:5432/${POSTGRES_DB:-mindspace}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:5001}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-mindspace-api}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://host.docker.internal:5001/api/auth/jwks}
      CORS_ORIGINS: '["http://localhost:4000","http://127.0.0.1:4000"]'
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - mindspace-api_default

volumes:
  mindspace-postgres-data:
    name: mindspace-api_mindspace-postgres-data

networks:
  default:
  mindspace-api_default:
    external: true
