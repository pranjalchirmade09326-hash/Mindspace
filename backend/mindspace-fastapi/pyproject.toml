[project]
name = "mindspace-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pranjal Chirmade", email = "pranjalchirmade09326@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.29.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "greenlet>=3.5.6",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
mindspace-fastapi = "mindspace_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
