services:
  mindspace-postgres:
    container_name: mindspace-postgres
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - mindspace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mindspace-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindspace-api
    depends_on:
      mindspace-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-mindspace}:${POSTGRES_PASSWORD:-dev-only-change-me}@mindspace-postgres:5432/${POSTGRES_DB:-mindspace}?schema=public"
      PORT: 8080
      HOST: 0.0.0.0
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mindspace-postgres-data:
