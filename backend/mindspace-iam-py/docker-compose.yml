services:
  mindspace-postgres:
    image: postgres:16
    container_name: mindspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindspace}
      POSTGRES_USER: ${POSTGRES_USER:-mindspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - "5433:5432"
    volumes:
      - mindspace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - mindspace-api_default

  mindspace-iam:
    build: .
    container_name: mindspace-iam
    restart: unless-stopped
    depends_on:
      mindspace-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mindspace}:${POSTGRES_PASSWORD:-dev-only-change-me}@mindspace-postgres:5432/${POSTGRES_DB:-mindspace}?schema=iam
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-replace-with-a-generated-32-byte-secret-0123456789abcdef}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:5001}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mindspace-api}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:4000}
      SEED_MINDSPACE_API: "false"
    ports:
      - "5001:5001"
    volumes:
      - ./app:/app/app:ro
    networks:
      - default
      - mindspace-api_default

volumes:
  mindspace-postgres-data:
    name: mindspace-api_mindspace-postgres-data

networks:
  default:
  mindspace-api_default:
    name: mindspace-api_default
